server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_kb_zero_node?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"          # TODO: 改成你自己的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 实训阶段用 update 自动建表；表结构见 schema.sql
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    # ---- 方式一：DeepSeek（OpenAI 兼容接入，推荐）----
    openai:
      api-key: ${DEEPSEEK_API_KEY}   # 从环境变量读取，不要硬编码
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # 屏蔽 OpenAI starter 默认的 embedding 探活，避免启动时报错
    model:
      embedding:
        enabled: false

logging:
  level:
    org.springframework.ai: info
